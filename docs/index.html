<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Crappy Birds | play in the browser</title>
<meta name="description" content="Browser version of Crappy Birds, my Java Swing take on Flappy Bird.">
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; color: #fff; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; box-sizing: border-box; }
  canvas { width: min(100%, calc((100vh - 90px) * 1500 / 860)); aspect-ratio: 1500 / 860; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.45); touch-action: manipulation; cursor: pointer; }
  p { margin: 0; color: #bbb; font-size: 14px; text-align: center; }
  a { color: #4fc3f7; }
</style>
</head>
<body>
<canvas id="game" width="1500" height="860" aria-label="Crappy Birds game. Click, tap or press space to jump."></canvas>
<p>Click, tap or press <b>space</b> to jump. Same physics as the Java version. <a href="https://github.com/Amatya27/CrappyBirds">Source on GitHub</a></p>
<script>
// Port of src/flappybird/FlappyBird.java. Same constants, same 20 ms tick.
const W = 1500, H = 860, GROUND = 120;
const canvas = document.getElementById("game");
const g = canvas.getContext("2d");

let bird, columns, ticks = 0, yMotion = 0, score = 0, started = false, gameOver = false;
let high = Number(localStorage.getItem("crappy-high") || 0), newBest = false;

const rand = n => Math.floor(Math.random() * n);
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function addColumn(start) {
  const space = 250, width = 100, height = 50 + rand(300);
  if (start) {
    columns.push({ x: W + width + columns.length * 300, y: H - height - GROUND, w: width, h: height });
    columns.push({ x: W + width + (columns.length - 1) * 300, y: 0, w: width, h: H - height - space });
  } else {
    const last = columns[columns.length - 1];
    columns.push({ x: last.x + 600, y: H - height - GROUND, w: width, h: height });
    columns.push({ x: last.x + 600, y: 0, w: width, h: H - height - space });
  }
}

function reset() {
  bird = { x: W / 2 - 10, y: H / 2 - 10, w: 20, h: 20 };
  columns = [];
  yMotion = 0;
  score = 0;
  for (let i = 0; i < 4; i++) addColumn(true);
}

function jump() {
  if (gameOver) { reset(); gameOver = false; newBest = false; }
  if (!started) started = true;
  else if (!gameOver) { if (yMotion > 0) yMotion = 0; yMotion -= 10; }
}

function tick() {
  const speed = 10;
  ticks++;
  if (started) {
    columns.forEach(c => c.x -= speed);
    if (ticks % 2 === 0 && yMotion < 15) yMotion += 2;

    for (let i = 0; i < columns.length; i++) {
      const c = columns[i];
      if (c.x + c.w < 0) {
        columns.splice(i, 1); i--;
        if (c.y === 0) addColumn(false);
      }
    }

    bird.y += yMotion;

    for (const c of columns) {
      const mid = bird.x + bird.w / 2, colMid = c.x + c.w / 2;
      if (c.y === 0 && mid > colMid - 10 && mid < colMid + 10 && !gameOver) score++;
      if (hit(c, bird)) {
        gameOver = true;
        if (bird.x <= c.x) bird.x = c.x - bird.w;
        else if (c.y !== 0) bird.y = c.y - bird.h;
        else if (bird.y < c.h) bird.y = c.h;
      }
    }

    if (bird.y > H - GROUND || bird.y < 0) gameOver = true;
    if (bird.y + yMotion >= H - GROUND) { bird.y = H - GROUND - bird.h; gameOver = true; }
    if (gameOver && score > high) { high = score; newBest = true; localStorage.setItem("crappy-high", high); }
  }
}

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function cloud(x, y, k) {
  g.beginPath();
  g.ellipse(x + 45 * k, y + 38 * k, 45 * k, 20 * k, 0, 0, Math.PI * 2);
  g.ellipse(x + 55 * k, y + 27 * k, 30 * k, 27 * k, 0, 0, Math.PI * 2);
  g.ellipse(x + 85 * k, y + 34 * k, 30 * k, 22 * k, 0, 0, Math.PI * 2);
  g.fill();
}

function background(moving) {
  const skyBottom = H - GROUND, drift = moving ? ticks : 0;
  const sky = g.createLinearGradient(0, 0, 0, skyBottom);
  sky.addColorStop(0, "#4fc3f7"); sky.addColorStop(1, "#b3e5fc");
  g.fillStyle = sky; g.fillRect(0, 0, W, skyBottom);

  g.fillStyle = "rgba(255,255,255,.8)";
  for (let i = 0; i < 5; i++) {
    const x = ((i * 340 + 120 - drift) % (W + 300) + (W + 300)) % (W + 300) - 150;
    cloud(x, 70 + (i * 97) % 260, 1 + (i % 3) * 0.25);
  }
  const hills = Math.floor(W / 210) + 3;
  g.fillStyle = "#a5d6a7";
  for (let i = 0; i < hills; i++) {
    const x = ((i * 210 - drift * 2) % (hills * 210) + hills * 210) % (hills * 210) - 210;
    g.beginPath(); g.ellipse(x + 110, skyBottom, 110, 70, 0, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = "#deb887"; g.fillRect(0, skyBottom, W, GROUND);
  g.fillStyle = "#7cb342"; g.fillRect(0, skyBottom, W, 18);
  g.fillStyle = "#2e7d32";
  const off = moving ? (ticks * 10) % 40 : 0;
  for (let x = -off; x < W; x += 40) g.fillRect(x, skyBottom + 18, 20, 6);
}

function pipe(c) {
  const body = g.createLinearGradient(c.x, 0, c.x + c.w, 0);
  body.addColorStop(0, "#81c784"); body.addColorStop(1, "#2e7d32");
  g.fillStyle = body; g.fillRect(c.x + 6, c.y, c.w - 12, c.h);
  const top = c.y === 0, capY = top ? c.y + c.h - 30 : c.y;
  const cap = g.createLinearGradient(c.x, 0, c.x + c.w, 0);
  cap.addColorStop(0, "#81c784"); cap.addColorStop(1, "#43a047");
  g.fillStyle = cap; rr(c.x, capY, c.w, 30, 4); g.fill();
  g.strokeStyle = "#2e7d32"; g.lineWidth = 3; g.stroke();
}

function drawBird(alive) {
  const tilt = Math.max(-0.45, Math.min(1.2, yMotion * 0.07));
  g.save();
  g.translate(bird.x + bird.w / 2, bird.y + bird.h / 2); g.rotate(tilt); g.scale(1.5, 1.5);
  const oval = (x, y, w, h, fill) => { g.fillStyle = fill; g.beginPath(); g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); g.fill(); };
  oval(-15, -9, 32, 24, "rgba(0,0,0,.16)");
  oval(-17, -12, 32, 24, "#ffca28");
  oval(-10, 0, 18, 10, "#fff59d");
  const flap = alive ? Math.sin(ticks * 0.9) * 5 : 0;
  oval(-16, -4 + flap, 16, 10, "#ffb300");
  g.strokeStyle = "#e65100"; g.lineWidth = 1.5; g.stroke();
  oval(3, -10, 11, 11, "#fff");
  oval(8, -7, 5, 5, "#1f2937");
  g.fillStyle = "#ff7043"; g.beginPath(); g.moveTo(12, -2); g.lineTo(23, 1); g.lineTo(12, 5); g.closePath(); g.fill();
  g.restore();
}

function text(s, x, y, color, font, align = "center") {
  g.fillStyle = color; g.font = font; g.textAlign = align; g.fillText(s, x, y);
}
const SANS = '-apple-system, "Segoe UI", Helvetica, Arial, sans-serif';

function card(x, y, w, h) {
  g.fillStyle = "rgba(0,0,0,.18)"; rr(x + 6, y + 10, w, h, 18); g.fill();
  g.fillStyle = "rgba(255,255,255,.94)"; rr(x, y, w, h, 18); g.fill();
}

function stat(x, y, label, value, color) {
  g.fillStyle = "#f3f4f6"; rr(x, y, 190, 110, 12); g.fill();
  text(label, x + 22, y + 34, "#6b7280", `bold 18px ${SANS}`, "left");
  text(String(value), x + 22, y + 92, color, `bold 52px ${SANS}`, "left");
}

function draw() {
  background(started);
  columns.forEach(pipe);
  drawBird(!gameOver);

  if (!started) {
    const w = 640, h = high > 0 ? 260 : 220, x = (W - w) / 2, y = H / 2 - h - 40;
    card(x, y, w, h);
    text("Crappy Birds", W / 2, y + 85, "#1f2937", `bold 60px ${SANS}`);
    text("Click, tap or press space to flap", W / 2, y + 145, "#4b5563", `28px ${SANS}`);
    if (high > 0) text("Best: " + high, W / 2, y + 205, "#f59e0b", `bold 30px ${SANS}`);
  } else if (gameOver) {
    const w = 560, h = 330, x = (W - w) / 2, y = H / 2 - h / 2 - 60;
    card(x, y, w, h);
    text("Game Over", W / 2, y + 80, "#dc2626", `bold 56px ${SANS}`);
    stat(x + 70, y + 115, "SCORE", score, "#1f2937");
    stat(x + w / 2 + 20, y + 115, "BEST", high, "#f59e0b");
    if (newBest) text("NEW BEST!", x + w / 2 + 20, y + 245, "#f59e0b", `bold 18px ${SANS}`, "left");
    text("Click, tap or press space to try again", W / 2, y + 295, "#4b5563", `24px ${SANS}`);
  } else {
    g.font = `bold 64px ${SANS}`;
    const w = Math.max(120, g.measureText(String(score)).width + 70), x = (W - w) / 2;
    g.fillStyle = "rgba(0,0,0,.28)"; rr(x, 30, w, 90, 45); g.fill();
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2; g.stroke();
    text(String(score), W / 2, 98, "#fff", `bold 64px ${SANS}`);
  }
}

reset();
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(now - last, 200); last = now;
  while (acc >= 20) { tick(); acc -= 20; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener("pointerdown", e => { e.preventDefault(); jump(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); if (!e.repeat) jump(); } });
</script>
</body>
</html>
