<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Crappy Birds | play in the browser</title>
<meta name="description" content="Browser version of Crappy Birds, my Java Swing take on Flappy Bird.">
<style>
  html, body { margin: 0; height: 100%; background: #1f1f1f; color: #fff; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; box-sizing: border-box; }
  canvas { width: min(100%, calc((100vh - 90px) * 1500 / 860)); aspect-ratio: 1500 / 860; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.45); touch-action: manipulation; cursor: pointer; }
  p { margin: 0; color: #bbb; font-size: 14px; text-align: center; }
  a { color: #ffc800; }
</style>
</head>
<body>
<canvas id="game" width="1500" height="860" aria-label="Crappy Birds game. Click, tap or press space to jump."></canvas>
<p>Click, tap or press <b>space</b> to jump. Same physics as the Java version. <a href="https://github.com/Amatya27/CrappyBirds">Source on GitHub</a></p>
<script>
// Port of src/flappybird/FlappyBird.java. Same constants, same 20 ms tick.
const W = 1500, H = 860, GROUND = 120;
const canvas = document.getElementById("game");
const g = canvas.getContext("2d");

let bird, columns, ticks = 0, yMotion = 0, score = 0, started = false, gameOver = false;
let high = Number(localStorage.getItem("crappy-high") || 0);

const rand = n => Math.floor(Math.random() * n);
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function addColumn(start) {
  const space = 250, width = 100, height = 50 + rand(300);
  if (start) {
    columns.push({ x: W + width + columns.length * 300, y: H - height - GROUND, w: width, h: height });
    columns.push({ x: W + width + (columns.length - 1) * 300, y: 0, w: width, h: H - height - space });
  } else {
    const last = columns[columns.length - 1];
    columns.push({ x: last.x + 600, y: H - height - GROUND, w: width, h: height });
    columns.push({ x: last.x + 600, y: 0, w: width, h: H - height - space });
  }
}

function reset() {
  bird = { x: W / 2 - 10, y: H / 2 - 10, w: 20, h: 20 };
  columns = [];
  yMotion = 0;
  score = 0;
  for (let i = 0; i < 4; i++) addColumn(true);
}

function jump() {
  if (gameOver) { reset(); gameOver = false; }
  if (!started) started = true;
  else if (!gameOver) { if (yMotion > 0) yMotion = 0; yMotion -= 10; }
}

function tick() {
  const speed = 10;
  ticks++;
  if (started) {
    columns.forEach(c => c.x -= speed);
    if (ticks % 2 === 0 && yMotion < 15) yMotion += 2;

    for (let i = 0; i < columns.length; i++) {
      const c = columns[i];
      if (c.x + c.w < 0) {
        columns.splice(i, 1); i--;
        if (c.y === 0) addColumn(false);
      }
    }

    bird.y += yMotion;

    for (const c of columns) {
      const mid = bird.x + bird.w / 2, colMid = c.x + c.w / 2;
      if (c.y === 0 && mid > colMid - 10 && mid < colMid + 10 && !gameOver) score++;
      if (hit(c, bird)) {
        gameOver = true;
        if (bird.x <= c.x) bird.x = c.x - bird.w;
        else if (c.y !== 0) bird.y = c.y - bird.h;
        else if (bird.y < c.h) bird.y = c.h;
      }
    }

    if (bird.y > H - GROUND || bird.y < 0) gameOver = true;
    if (bird.y + yMotion >= H - GROUND) { bird.y = H - GROUND - bird.h; gameOver = true; }
    if (gameOver && score > high) { high = score; localStorage.setItem("crappy-high", high); }
  }
}

function text(s, x, y, color = "#fff", size = 70, align = "left") {
  g.fillStyle = color; g.font = `bold ${size}px Georgia, serif`; g.textAlign = align; g.fillText(s, x, y);
}

function draw() {
  g.fillStyle = "#ffc800"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#404040"; g.fillRect(0, H - GROUND, W, GROUND);
  g.fillStyle = "#fff"; g.fillRect(bird.x, bird.y, bird.w, bird.h);
  g.fillStyle = "#000"; columns.forEach(c => g.fillRect(c.x, c.y, c.w, c.h));

  if (!started) {
    text("Welcome to Crappy Birds", W / 2, 300, "#fff", 70, "center");
    text("click, tap or press space to begin", W / 2, 380, "#fff", 40, "center");
  }
  if (gameOver) {
    text("Score: " + score, 100, 120);
    text("Game Over!", 100, 300, "#d00000");
    text("Try again?", 100, 390);
    text("High Score: " + high, 100, 520);
  }
  if (!gameOver && started) text(String(score), W / 2, 100, "#fff", 70, "center");
  if (!started && high > 0) text("High Score: " + high, W / 2, 470, "#fff", 40, "center");
}

reset();
let acc = 0, last = performance.now();
function loop(now) {
  acc += Math.min(now - last, 200); last = now;
  while (acc >= 20) { tick(); acc -= 20; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener("pointerdown", e => { e.preventDefault(); jump(); });
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); if (!e.repeat) jump(); } });
</script>
</body>
</html>
